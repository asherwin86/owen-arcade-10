# render.yaml
# Android apps can't run on Render, so this web service hosts the leaderboard API
# plus a landing page (public/index.html) that serves the built APK from releases/.

services:
  - type: web
    name: arcade-10-backend
    env: node # Change this to your backend runtime (node, python, docker, etc.)
    region: oregon
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
